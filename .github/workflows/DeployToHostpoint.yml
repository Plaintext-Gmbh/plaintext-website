name: DeployToHostpoint

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SetupNode
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: InstallDependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Operative Dateien neben der Site (Server-Logs, Backup-ZIPs, watch.php mit
      # API-Token, private Uploads) sind kein Teil des Builds und werden
      # ausgeschlossen, damit die FTP-Deploy-Action sie nicht löscht.
      - name: DeployViaFtps
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /www/plaintext.ch/
          security: strict
          timeout: 60000
          log-level: verbose
          exclude: |
            **/*.zip
            **/*.log
            **/*.txt
            **/watch.php
            **/privat*
            **/42.png
            **/logo.png

      - name: ReportSuccess
        run: |
          echo "Deployment to Hostpoint successful"
          echo "URL: https://plaintext.ch"
