name: Deploy to Hostpoint

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deploy to www/plaintext.ch on Hostpoint. Operational files that live
      # next to the site but are not part of the build (server-side logs, large
      # backup zips, the watch.php endpoint that holds an API token, private
      # uploads) are excluded so the FTP-Deploy-Action never deletes them.
      - name: Deploy to Hostpoint via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /www/plaintext.ch/
          security: strict
          timeout: 60000
          log-level: verbose
          exclude: |
            **/*.zip
            **/*.log
            **/*.txt
            **/watch.php
            **/privat*
            **/42.png
            **/logo.png

      - name: Deployment success
        run: |
          echo "Deployment to Hostpoint successful"
          echo "URL: https://plaintext.ch"