name: Deploy Feature Branch to GitHub Pages

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deployment at a time for feature branches
concurrency:
  group: "feature-pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with branch info
        run: |
          npm run build
          # Add branch info to built site
          echo "<div style='position:fixed;top:10px;right:10px;background:#ff6b35;color:white;padding:5px 10px;border-radius:5px;z-index:9999;font-family:monospace;'>🔍 Feature: ${{ github.ref_name }}</div>" >> dist/index.html

      - name: Deploy to GitHub Pages (Feature Branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: feature/${{ github.ref_name }}
          keep_files: true

      - name: Comment deployment info
        uses: actions/github-script@v8
        with:
          script: |
            const branchName = '${{ github.ref_name }}';
            const previewUrl = `https://daniel-marthaler.github.io/plaintext-website/feature/${branchName}`;
            
            console.log(`🚀 Feature branch deployment successful!`);
            console.log(`📍 Preview URL: ${previewUrl}`);
            console.log(`🔧 Branch: ${branchName}`);
            console.log(`✅ Images: daniel.jpg + jasmin.jpg ready for testing`);