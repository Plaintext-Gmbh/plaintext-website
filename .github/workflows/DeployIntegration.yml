name: DeployIntegration

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest
    environment:
      name: integration
      url: ${{ steps.slug.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SetupNode
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: InstallDependencies
        run: npm ci

      - name: SanitizeBranchSlug
        id: slug
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          slug="${REF_NAME//\//-}"
          slug="${slug//[^a-zA-Z0-9_-]/-}"
          slug="${slug,,}"
          url="https://plaintext.ch/integration/${slug}/"
          echo "value=$slug" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Integration slug: $slug"
          echo "Integration URL:  $url"

      - name: Build
        env:
          ASTRO_BASE: /integration/${{ steps.slug.outputs.value }}/
          ASTRO_SITE: https://plaintext.ch
        run: npm run build

      - name: DeployViaFtps
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /www/plaintext.ch/integration/${{ steps.slug.outputs.value }}/
          security: strict
          timeout: 60000
          log-level: verbose
          state-name: .ftp-deploy-sync-state.json

      - name: CleanupOrphanedIntegrations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          CURRENT_SLUG: ${{ steps.slug.outputs.value }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null

          mapfile -t LIVE_SLUGS < <(
            gh api --paginate "repos/${REPO}/branches" --jq '.[].name' | while read -r b; do
              s="${b//\//-}"
              s="${s//[^a-zA-Z0-9_-]/-}"
              echo "${s,,}"
            done | sort -u
          )
          echo "Aktive Branch-Slugs (${#LIVE_SLUGS[@]}):"
          printf '  - %s\n' "${LIVE_SLUGS[@]}"

          ftp_listing=$(lftp -u "${FTP_USER},${FTP_PASS}" -e "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set ftp:passive-mode true
            cd /www/plaintext.ch/integration/
            cls -F1 --sort=name
            bye
          " "${FTP_SERVER}" 2>&1) || {
            echo "::error::lftp Listing fehlgeschlagen"
            echo "${ftp_listing}"
            exit 1
          }
          echo "Raw lftp listing:"
          printf '%s\n' "${ftp_listing}" | sed 's/^/  | /'

          mapfile -t FTP_DIRS < <(
            printf '%s\n' "${ftp_listing}" \
              | grep '/$' \
              | sed 's:/$::' \
              | grep -v '^$' || true
          )
          echo "FTP-Verzeichnisse unter /integration/ (${#FTP_DIRS[@]}):"
          printf '  - %s\n' "${FTP_DIRS[@]}"

          orphaned=0
          for dir in "${FTP_DIRS[@]}"; do
            [[ -z "$dir" ]] && continue
            if [[ "$dir" == "$CURRENT_SLUG" ]]; then
              continue
            fi
            found=0
            for live in "${LIVE_SLUGS[@]}"; do
              if [[ "$dir" == "$live" ]]; then
                found=1
                break
              fi
            done
            if (( !found )); then
              orphaned=$((orphaned + 1))
              echo "Loesche verwaistes Verzeichnis: $dir"
              lftp -u "${FTP_USER},${FTP_PASS}" -e "
                set ftp:ssl-force true
                set ftp:ssl-protect-data true
                set ssl:verify-certificate true
                set ftp:passive-mode true
                rm -r /www/plaintext.ch/integration/${dir}
                bye
              " "${FTP_SERVER}"
            fi
          done

          echo "Cleanup fertig — ${orphaned} verwaiste Verzeichnisse entfernt"

      - name: PostPrComment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ steps.slug.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          retry_gh() {
            local max=4 attempt=1 out rc
            while (( attempt <= max )); do
              out=$("$@" 2>&1)
              rc=$?
              if (( rc == 0 )); then
                printf '%s' "${out}"
                return 0
              fi
              echo "gh attempt ${attempt}/${max} failed (rc=${rc}): ${out}" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }

          if ! PR_NUMBER=$(retry_gh gh pr list --repo "${REPO}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty'); then
            echo "::warning::gh pr list failed nach Retries — kein Comment gepostet"
            exit 0
          fi
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "Kein offener PR fuer Branch '${BRANCH}' gefunden — kein Comment"
            exit 0
          fi
          echo "Gefundener PR: #${PR_NUMBER}"

          MARKER="<!-- integration-deploy-comment -->"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT_SHA="${SHA:0:7}"

          {
            echo "${MARKER}"
            echo ""
            echo "🚀 **Integration Deploy**"
            echo ""
            echo "[${URL}](${URL})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Deployed | ${NOW} |"
          } > "${RUNNER_TEMP}/comment.md"

          if ! EXISTING_ID=$(retry_gh gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id"); then
            echo "::warning::gh api comments-Listing failed — versuche neuen Comment zu posten"
            EXISTING_ID=""
          else
            EXISTING_ID=$(printf '%s' "${EXISTING_ID}" | head -n1)
          fi

          if [[ -n "${EXISTING_ID}" ]]; then
            echo "Aktualisiere bestehenden Comment ${EXISTING_ID}"
            retry_gh gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" \
              -F body=@"${RUNNER_TEMP}/comment.md" || {
              echo "::warning::PATCH des Comments fehlgeschlagen"
              exit 0
            }
          else
            echo "Erstelle neuen Comment auf PR #${PR_NUMBER}"
            retry_gh gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@"${RUNNER_TEMP}/comment.md" || {
              echo "::warning::POST des Comments fehlgeschlagen"
              exit 0
            }
          fi

      - name: ReportUrl
        env:
          URL: ${{ steps.slug.outputs.url }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "::notice title=Integration deployed::${URL}"
          {
            echo "## Integration deployed"
            echo ""
            echo "**[${URL}](${URL})**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Commit | \`${SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
