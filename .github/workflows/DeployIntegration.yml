name: DeployIntegration

on:
  push:
    branches-ignore: [master]
  # Branch gelöscht (z.B. nach PR-Merge): nur CleanupOrphanedIntegrations läuft, damit
  # das per-branch-Verzeichnis nicht bis zum nächsten fremden Push liegen bleibt.
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest
    environment:
      name: integration
      url: ${{ steps.slug.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SetupNode
        if: github.event_name != 'delete'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: InstallDependencies
        if: github.event_name != 'delete'
        run: npm ci

      - name: SanitizeBranchSlug
        if: github.event_name != 'delete'
        id: slug
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          slug="${REF_NAME//\//-}"
          slug="${slug//[^a-zA-Z0-9_-]/-}"
          slug="${slug,,}"
          url="https://plaintext.ch/integration/${slug}/"
          echo "value=$slug" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Integration slug: $slug"
          echo "Integration URL:  $url"

      - name: Build
        if: github.event_name != 'delete'
        env:
          ASTRO_BASE: /integration/${{ steps.slug.outputs.value }}/
          ASTRO_SITE: https://plaintext.ch
        run: npm run build

      - name: SetupSsh
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: AddKnownHosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: DeployViaRsync
        if: github.event_name != 'delete'
        # Integration-Build (eigenes per-branch-Unterverzeichnis) via rsync/SSH statt FTPS
        # (gleicher Mechanismus wie DeployProd; macht die FTP_*-Secrets obsolet). --delete
        # säubert genau das slug-Unterverzeichnis (pro Branch isoliert). slug ist sanitisiert,
        # hier zusätzlich gegen leer geguardet, damit das Ziel nie auf integration/ kollabiert.
        env:
          SLUG: ${{ steps.slug.outputs.value }}
        run: |
          if [[ -z "$SLUG" ]]; then
            echo "::error::Leerer Integration-Slug — Abbruch (Ziel würde auf integration/ kollabieren)."
            exit 1
          fi
          rsync -avz --delete \
            ./dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:www/plaintext.ch/integration/${SLUG}/

      - name: CleanupOrphanedIntegrations
        # Verwaiste per-branch-Verzeichnisse via SSH aufräumen (statt lftp/FTPS). Nutzt den
        # bereits geladenen ssh-agent + known_hosts der Deploy-Schritte. Läuft auch beim
        # delete-Event (CURRENT_SLUG dann leer, der Vergleich greift einfach nicht).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_SLUG: ${{ steps.slug.outputs.value }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail

          mapfile -t LIVE_SLUGS < <(
            gh api --paginate "repos/${REPO}/branches" --jq '.[].name' | while read -r b; do
              s="${b//\//-}"
              s="${s//[^a-zA-Z0-9_-]/-}"
              echo "${s,,}"
            done | sort -u
          )
          echo "Aktive Branch-Slugs (${#LIVE_SLUGS[@]}):"
          printf '  - %s\n' "${LIVE_SLUGS[@]}"

          # Vorhandene Integration-Verzeichnisse per SSH listen (nur Namen).
          mapfile -t REMOTE_DIRS < <(
            ssh "${SSH_USER}@${SSH_HOST}" \
              "ls -1 www/plaintext.ch/integration/ 2>/dev/null || true" \
              | sed 's:/$::' \
              | grep -vxE '\.|\.\.' \
              | sort -u || true
          )
          echo "Remote-Verzeichnisse unter integration/ (${#REMOTE_DIRS[@]}):"
          printf '  - %s\n' "${REMOTE_DIRS[@]}"

          orphaned=0
          for dir in "${REMOTE_DIRS[@]}"; do
            [[ -z "$dir" ]] && continue
            # Guard: nie auf integration/ selbst oder Sonderpfade löschen; nur sanitisierte Slugs.
            [[ "$dir" == "." || "$dir" == ".." ]] && continue
            [[ ! "$dir" =~ ^[A-Za-z0-9_-]+$ ]] && { echo "Überspringe unerwarteten Namen: '$dir'"; continue; }
            [[ "$dir" == "$CURRENT_SLUG" ]] && continue
            found=0
            for live in "${LIVE_SLUGS[@]}"; do
              if [[ "$dir" == "$live" ]]; then
                found=1
                break
              fi
            done
            if (( !found )); then
              orphaned=$((orphaned + 1))
              echo "Lösche verwaistes Verzeichnis: $dir"
              ssh "${SSH_USER}@${SSH_HOST}" "rm -rf -- www/plaintext.ch/integration/${dir}"
            fi
          done

          echo "Cleanup fertig — ${orphaned} verwaiste Verzeichnisse entfernt"

      - name: PostPrComment
        if: github.event_name != 'delete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ steps.slug.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          retry_gh() {
            local max=4 attempt=1 out rc
            while (( attempt <= max )); do
              out=$("$@" 2>&1)
              rc=$?
              if (( rc == 0 )); then
                printf '%s' "${out}"
                return 0
              fi
              echo "gh attempt ${attempt}/${max} failed (rc=${rc}): ${out}" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }

          if ! PR_NUMBER=$(retry_gh gh pr list --repo "${REPO}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty'); then
            echo "::warning::gh pr list failed nach Retries — kein Comment gepostet"
            exit 0
          fi
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "Kein offener PR fuer Branch '${BRANCH}' gefunden — kein Comment"
            exit 0
          fi
          echo "Gefundener PR: #${PR_NUMBER}"

          MARKER="<!-- integration-deploy-comment -->"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT_SHA="${SHA:0:7}"

          {
            echo "${MARKER}"
            echo ""
            echo "🚀 **Integration Deploy**"
            echo ""
            echo "[${URL}](${URL})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Deployed | ${NOW} |"
          } > "${RUNNER_TEMP}/comment.md"

          if ! EXISTING_ID=$(retry_gh gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id"); then
            echo "::warning::gh api comments-Listing failed — versuche neuen Comment zu posten"
            EXISTING_ID=""
          else
            EXISTING_ID=$(printf '%s' "${EXISTING_ID}" | head -n1)
          fi

          if [[ -n "${EXISTING_ID}" ]]; then
            echo "Aktualisiere bestehenden Comment ${EXISTING_ID}"
            retry_gh gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" \
              -F body=@"${RUNNER_TEMP}/comment.md" || {
              echo "::warning::PATCH des Comments fehlgeschlagen"
              exit 0
            }
          else
            echo "Erstelle neuen Comment auf PR #${PR_NUMBER}"
            retry_gh gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@"${RUNNER_TEMP}/comment.md" || {
              echo "::warning::POST des Comments fehlgeschlagen"
              exit 0
            }
          fi

      - name: ReportUrl
        if: github.event_name != 'delete'
        env:
          URL: ${{ steps.slug.outputs.url }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "::notice title=Integration deployed::${URL}"
          {
            echo "## Integration deployed"
            echo ""
            echo "**[${URL}](${URL})**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Commit | \`${SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
