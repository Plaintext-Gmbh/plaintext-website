name: DeployProd

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SetupNode
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: InstallDependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SetupSshKey
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: AddKnownHost
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Operative Dateien neben der Site (Server-Logs, Backup-ZIPs, watch.php mit
      # API-Token, private Uploads, integration/* per-branch builds) gehoeren
      # nicht zum Build und werden via rsync --exclude unangetastet gelassen.
      # rsync-Excludes sind bidirektional: ausgeschlossene Dateien sind fuer
      # rsync nicht sichtbar, --delete laesst sie also liegen.
      - name: DeployViaRsync
        # Schutz-Excludes als Single Source of Truth in deploy-excludes.txt (geteilt mit
        # deploy-direct.sh) statt inline dupliziert.
        run: |
          rsync -avz --delete \
            --exclude-from=deploy-excludes.txt \
            ./dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:www/plaintext.ch/

      - name: ReportSuccess
        run: |
          echo "Deployment to Hostpoint successful"
          echo "URL: https://plaintext.ch"
